<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda estetista</title>
<style>
:root{--bg:#fdf6f4;--card:#fff;--tx:#3a2e2e;--mu:#8a7a7a;--ac:#c9788a;--bd:#ecdcdc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}h1{font-family:Georgia,serif;font-size:22px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.r{padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.r:last-child{border:0}
.m{color:var(--mu);font-size:13px}.e{color:#c0392b;font-size:13px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font:inherit;margin-bottom:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:var(--ac);color:#fff;padding:12px;width:100%;font-weight:600}
a{color:var(--ac);font-size:13px;cursor:pointer}
</style></head><body><div class="w" id="app"></div>
<script>
const $=document.getElementById("app");
const pad=n=>String(n).padStart(2,"0"),hm=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const it=d=>new Date(d+"T12:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
const tok=()=>sessionStorage.getItem("tk");
function loginView(err=""){
  $.innerHTML=`<h1>Area estetista</h1><div class="c"><input id="pw" type="password" placeholder="Password"><p class="e">${err}</p><button onclick="login()">Entra</button></div><a href="/">← Torna alla prenotazione</a>`;
}
async function login(){
  const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})});
  const j=await r.json();
  if(r.ok){sessionStorage.setItem("tk",j.token);agenda()}else loginView(j.error);
}
async function agenda(){
  const r=await fetch("/api/admin/bookings",{headers:{Authorization:"Bearer "+tok()}});
  if(r.status===401){sessionStorage.removeItem("tk");return loginView()}
  const L=await r.json();let h="<h1>Agenda</h1>",cur="";
  L.forEach(b=>{
    if(b.date!==cur){cur=b.date;h+=`${h.endsWith("</h1>")?"":"</div>"}<div class="c"><b>${it(b.date)}</b>`}
    h+=`<div class="r"><b>${hm(b.start)}–${hm(b.start+b.dur)}</b> · ${esc(b.name)}<br><span class="m">${esc(b.treat)}${b.phone?" · "+esc(b.phone):""}</span> <a onclick="del(${b.id})">annulla</a></div>`;
  });
  $.innerHTML=h+(L.length?"</div>":'<p class="m">Nessuna prenotazione in programma.</p>')+`<a onclick="sessionStorage.removeItem('tk');loginView()">Esci</a>`;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function del(id){
  if(!confirm("Annullare questa prenotazione?"))return;
  await fetch("/api/admin/bookings/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+tok()}});
  agenda();
}
tok()?agenda():loginView();
</script></body></html>
